# Test Profile Configuration

# Database (H2 for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Database
spring.h2.console.enabled=false

# File Storage (in-memory for testing)
storage.base-path=target/test-storage
storage.max-file-size=5242880
storage.max-resolution=1920

# JWT
jwt.secret=test-secret-key-for-testing-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=3600000

# App
app.base-url=http://localhost:8080

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS (permissive for testing)
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Logging
logging.level.com.example.outfitcreator=DEBUG
logging.level.org.springframework=WARN

# Server
server.port=8081

# SpringDoc OpenAPI (disabled for tests)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
