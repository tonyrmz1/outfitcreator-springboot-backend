# H2 Console (enabled for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Storage
storage.base-path=storage
storage.max-file-size=5242880
storage.max-resolution=1920

# JWT (less secure for dev, shorter expiration for testing)
jwt.secret=dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# App
app.base-url=http://localhost:8080

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS (permissive for dev)
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Logging (verbose for dev)
logging.level.com.example.outfitcreator=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# SpringDoc OpenAPI (enabled for dev)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Actuator (enabled for dev)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
