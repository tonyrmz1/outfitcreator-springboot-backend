# Production Profile Configuration

# Database (PostgreSQL for production - use environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outfitcreator_prod}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (optimized for production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=OutfitCreatorHikariPool

# JPA/Hibernate (strict for production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# H2 Console (disabled for production)
spring.h2.console.enabled=false

# File Storage (use environment variable for production path)
storage.base-path=${STORAGE_PATH:/var/outfitcreator/storage}
storage.max-file-size=5242880
storage.max-resolution=1920

# JWT (use environment variables for production)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App
app.base-url=${APP_BASE_URL:https://api.outfitcreator.com}

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS (restrictive for production - use environment variable)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://outfitcreator.com,https://www.outfitcreator.com}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept
cors.allow-credentials=true
cors.max-age=3600

# Logging (minimal for production)
logging.level.com.example.outfitcreator=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.file.name=${LOG_FILE:/var/log/outfitcreator/application.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# SSL/TLS (if using embedded Tomcat with SSL)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

# SpringDoc OpenAPI (disabled for production)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator (restricted for production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Connection Pool Monitoring
spring.jpa.properties.hibernate.generate_statistics=false
