# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s
spring.cache.cache-names=users,colorWheel

# H2 Database for testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Storage
storage.base-path=storage
storage.max-file-size=5242880
storage.max-resolution=1920

# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=your-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# App
app.base-url=http://localhost:8080

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,Accept,Origin,X-Requested-With
cors.allow-credentials=true
cors.max-age=3600

# Logging
logging.level.com.example.outfitcreator=DEBUG
logging.level.org.springframework=INFO

# Server
server.port=8080

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
